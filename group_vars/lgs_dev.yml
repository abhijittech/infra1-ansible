# ~/.hermes/profiles/infra1/ansible/group_vars/lgs_dev.yml
# Per-env overrides for the LGS dev target (ssh ubuntu-server).
#
# Mirrors the shape of group_vars/lgs_local.yml; only the path differs
# because the source tree lives at /root/projs/lgs/... on the remote
# (vs /home/amd/projects/... on the WSL controller).
#
# compose_env_file is INHERITED from group_vars/lgs.yml as
# "{{ be_repo }}/.env.development", so flipping be_repo here is
# sufficient — the env file path follows automatically.
#
# Created: 2026-10-15 (Lift 2: ssh target for LGS deploy dispatcher)
# Mirrors the pitaas_dev pattern (per-env var file under group_vars/).

be_repo: /root/projs/lgs/sales_agentic-ai-middleware

# --- ubuntu-server env file ---
# Production talks to the real frontend at https://optileads.gennxt.co.
# A SEPARATE file (not .env.development) means the WSL dev value can
# never leak into production, and prod values can never break dev.
#
# The env file itself is UNTRACKED + GITIGNORED (see the LGS repo's
# .gitignore) — ansible selects it by NAME, the file stays local.
#
# It MUST be created on the host before the first deploy:
#   cd /root/projs/lgs/sales_agentic-ai-middleware
#   cp .env.development .env.production
#   sed -i 's|^LGS_APP_URL=.*|LGS_APP_URL=https://optileads.gennxt.co|' .env.production
# The predeploy guard (scripts/lgs_predeploy_check.py) refuses to deploy
# if this file is missing or holds a dev-only URL.
compose_env_name: .env.production
