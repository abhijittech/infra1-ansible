# ~/.hermes/profiles/infra1/ansible/inventory.yml
# Multi-project, multi-server inventory. One host per (project, env, server_id) row.
#
# ★ The projects/<slug>.yaml is the human-readable source of truth for
# env-keyed SSH creds. This inventory is what Ansible consumes; the
# shared shape is duplicated by design (Ansible needs a specific format).
# When projects/<slug>.yaml changes, run scripts/regen-inventory.sh to
# regenerate this file. (regen-inventory.sh is a small Python script
# that reads each project's YAML and writes the corresponding hosts.)
#
# Conventions:
# - server_id is kebab-case: <project>-<env>-<N> (e.g., pitaas-dev-1)
# - group name = <project>_<env>  (e.g., pitaas_dev)
# - parent group = <project>      (e.g., pitaas)
# - top-level [all:vars] has cross-cutting defaults (ssh key paths, etc.)

all:
  vars:
    # ★ Per-project SSH keys live in ~/.hermes/profiles/infra1/ssh/<slug>_<purpose>.
    # This default assumes pitaas; per-host vars override for LGS, rpkg, etc.
    ansible_ssh_private_key_file: ~/.hermes/profiles/infra1/ssh/pitaas_dev_admin
    # ★ ansible_ssh_common_args is a single string of ssh -o options.
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.hermes/profiles/infra1/ssh/known_hosts
      -o ConnectTimeout=8
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ============================================================
    # pitaas
    # ============================================================
    pitaas:
      children:
        pitaas_dev:
          hosts:
            pitaas_dev_1:                       # ★ canonical ansible hostname; alias for server_id
              ansible_host: 103.117.50.250
              ansible_port: 4422
              ansible_user: pit_deploy_usr1
              server_id: pitaas-dev-1
              os_hostname: HYRH-VPC339
              env: dev
              # ★ When staging/prod land, add new children groups here.
        # pitaas_staging: (future)
        # pitaas_prod: (future)

    # ============================================================
    # lgs  (sales_agentic-ai-middleware)
    #
    # 2026-10-15: added lgs_local group (WSL controller, connection=local).
    # Matches the canonical pitaas_dev pattern but without SSH — see
    # playbooks/deploy-be-lgs.yml § "★ Pattern A" inline comment.
    #
    # 2026-10-15: added lgs_dev group (ssh ubuntu-server, root@:3443).
    # Uses a dedicated lgs_dev_admin ED25519 key (NOT pitaas_dev_admin
    # — separate projects get separate automation keys; see plan
    # §"split by purpose" 2026-10-15). The pubkey was added to
    # ubuntu-server:/root/.ssh/authorized_keys under comment
    # `infra1-lgs-dev-2026-10-15`. Verified via
    # `ansible -i inventory.yml lgs_dev_1 -m ping` on 2026-10-15.
    # ============================================================
    lgs:
      children:
        lgs_local:
          hosts:
            lgs_local_1:                                  # WSL controller (this machine)
              server_id: lgs-local-1
              env: local
              ansible_connection: local                   # ★ Pattern A: no SSH
              ansible_python_interpreter: /usr/bin/python3
        lgs_dev:
          hosts:
            lgs_dev_1:                                    # production-ish: ssh ubuntu-server
              ansible_host: 103.228.151.57
              ansible_port: 3443
              ansible_user: root
              # ★ Per-host override: dedicated LGS automation key.
              # (Pitfall: do NOT use the pitaas_dev_admin default
              # for LGS — cross-project key reuse is what we're
              # explicitly avoiding. Each project owns its admin key.)
              ansible_ssh_private_key_file: ~/.hermes/profiles/infra1/ssh/lgs_dev_admin
              server_id: lgs-dev-1
              os_hostname: HYRH-VPC106
              env: dev
              ansible_python_interpreter: /usr/bin/python3
        lgs_fe_dev:
          hosts:
            lgs_fe_dev_1:                                 # FE role on the same physical server
              ansible_host: 103.228.151.57
              ansible_port: 3443
              ansible_user: root
              # ★ Same key as lgs_dev_1 (FE is part of the same LGS project).
              ansible_ssh_private_key_file: ~/.hermes/profiles/infra1/ssh/lgs_dev_admin
              server_id: lgs-fe-dev-1
              os_hostname: HYRH-VPC106
              env: dev
              ansible_python_interpreter: /usr/bin/python3

    # ============================================================
    # rpkg  (placeholder; rpkg infra TBD)
