# ~/.hermes/profiles/infra1/ansible/ansible.cfg
# Canonical Ansible config for the infra1 profile.
#
# Per R6 in infra1-doctrine: ansible-playbook is the audit-trail standard
# for any op that touches 2+ hosts, OR is non-idempotent, OR is repeated.
# This config is the single source of truth for ssh + check defaults.

[defaults]
inventory = ./inventory.yml
roles_path = ./roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = yaml
forks = 5
timeout = 30
log_path = ~/.hermes/profiles/infra1/logs/ansible.log

[ssh_connection]
pipelining = True
ssh_args = -o BatchMode=yes -o ConnectTimeout=8 -o ServerAliveInterval=30

[privilege_escalation]
become = False
# Pit_deploy_usr1 has NOPASSWD sudo; when a task needs sudo, set become: true
# at the task level. Default off keeps read-only probes safe.

[diff]
# Always show file diffs in --check mode
always = True
