# pitaas_v3-frontend-1: serve FE static bundles (★ idempotent)
#
# Architecture (per-host multi-tenant):
#   1. Traefik routes <slug>.pitaas.rtcnexora.com → this nginx (port 8080)
#   2. This nginx dispatches by Host to the right per-host server block
#   3. Each per-host block serves the Vite-built bundle from /var/www/pitaas/<bundle>-app/
#   4. Each per-host block proxies /api/* to the backend with X-Frappe-Site-Name
#      set to the matching Frappe site (apex.v3.local, pitaas-v3-dev.local, etc.)
#   5. The /api/ paths are URL-hygiene rewrites (Q-AUTH9): /api/login maps
#      to /api/method/pitaas.api.auth.login, etc.
#
# Source of truth for the rewrite rules:
#   /home/amd/projects/pitaas_v3/docker/resources/core/nginx/nginx-template.conf
# (We hand-port the rules here, replacing pitaas-v3-dev.local with the
# per-host $cust-derived site name. See "URL-hygiene rewrites (Q-AUTH9)".)

# ============================================================================
# Server: catch-all (default_server) — serves customer-app for unknown hosts
# ============================================================================
server {
    listen 8080 default_server;
    server_name _;

    # Default root: customer-app
    root /var/www/pitaas/customer-app;
    index index.html;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Generic /api/ proxy (no rewrite). Used as a fallback.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host pitaas-v3-dev.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================================
# Per-Host: dev.pitaas.rtcnexora.com → customer-app
# Special-case: dev maps to pitaas-v3-dev.local (not dev.v3.local — that
# Frappe site doesn't exist; only pitaas-v3-dev.local + apex.v3.local are
# provisioned). When a real dev.v3.local site is created, this block can
# be removed (the regex below will handle it).
# ============================================================================
server {
    listen 8080;
    server_name dev.pitaas.rtcnexora.com;

    root /var/www/pitaas/customer-app;
    index index.html;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # ----- URL-hygiene rewrites (Q-AUTH9) -----
    location = /api/login {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name pitaas-v3-dev.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.login;
    }
    location = /api/logout {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name pitaas-v3-dev.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.logout;
    }
    location = /api/me {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name pitaas-v3-dev.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.whoami;
    }

    # Generic /api/ catch-all — pitaas-v3-dev.local for dev
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host pitaas-v3-dev.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================================================================
# Per-Host: <slug>.pitaas.rtcnexora.com → customer-app (γ-transitional)
# Maps <slug> → <slug>.v3.local in the Frappe backend.
# ============================================================================
server {
    listen 8080;
    server_name ~^(?<cust>[a-z0-9-]+)\.pitaas\.rtcnexora\.com$;

    root /var/www/pitaas/customer-app;
    index index.html;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # ----- URL-hygiene rewrites (Q-AUTH9) -----
    # /api/login → /api/method/pitaas.api.auth.login
    location = /api/login {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.login;
    }

    # /api/logout → /api/method/pitaas.api.auth.logout
    location = /api/logout {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.logout;
    }

    # /api/me → /api/method/pitaas.api.auth.whoami
    location = /api/me {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.whoami;
    }

    # /api/auth/forgot-password → /api/method/pitaas.api.auth.forgot_password
    location = /api/auth/forgot-password {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.forgot_password;
    }

    # /api/auth/reset-password → /api/method/pitaas.api.auth.reset_password
    location = /api/auth/reset-password {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.reset_password;
    }

    # /api/auth/change-password → /api/method/pitaas.api.auth.change_password
    location = /api/auth/change-password {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.auth.change_password;
    }

    # /api/dashboard/customer-home → /api/method/pitaas.api.dashboard.get_customer_home_clean
    location = /api/dashboard/customer-home {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.dashboard.get_customer_home_clean;
    }

    # /api/dashboard/inventory-home → /api/method/pitaas.api.dashboard.get_inventory_dashboard_clean
    location = /api/dashboard/inventory-home {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.dashboard.get_inventory_dashboard_clean;
    }

    # /api/items → /api/method/pitaas.api.item.list_items_clean
    location = /api/items {
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $cust.v3.local;
        proxy_set_header Host $host;
        proxy_pass http://backend:8000/api/method/pitaas.api.item.list_items_clean;
    }

    # ----- Generic /api/ catch-all (for pitaas.api.* and frappe.* endpoints) -----
    # Sends everything else to the backend with the right site name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $cust.v3.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ----- Static assets -----
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

